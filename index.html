<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpesaFacile 🛒</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f7f3;color:#163c2e;margin:0}header{background:#164936;color:white;padding:25px;text-align:center}main{max-width:520px;margin:auto;padding:16px}.card{background:white;padding:20px;border-radius:18px;margin:15px 0;box-shadow:0 3px 15px #1232}h1{margin:0}h2{font-size:19px}#total{font-size:44px;font-weight:800;color:#14744c}label{display:block;margin:12px 0 5px;font-weight:600}input{box-sizing:border-box;width:100%;font-size:18px;padding:12px;border:1px solid #cadbd0;border-radius:10px}.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}button{border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}.add{background:#18875b;color:white;width:100%;margin-top:16px}.remove,.clear{background:#ffece9;color:#96382c}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.muted{color:#708579;font-size:14px}#budgetMsg{margin-top:10px}footer{text-align:center;color:#708579;font-size:13px;padding:12px}</style></head><body><header><h1>🛒 SpesaFacile</h1><p>Il conto prima della cassa!</p></header><main><section class="card"><div class="muted">TOTALE CARRELLO</div><div id="total">0,00 €</div><div id="count" class="muted">0 articoli</div></section><section class="card"><h2>➕ Aggiungi prodotto</h2><form id="form"><label for="name">Nome</label><input id="name" placeholder="Es. Latte" required maxlength="80"><div class="row"><div><label for="price">Prezzo €</label><input id="price" inputmode="decimal" placeholder="1,49" required></div><div><label for="qty">Quantità</label><input id="qty" type="number" min="1" max="999" value="1" required></div></div><button class="add">Aggiungi ＋</button></form></section><section class="card"><h2>🎯 Budget facoltativo</h2><input id="budget" inputmode="decimal" placeholder="Es. 50,00"><div id="budgetMsg" class="muted"></div></section><section class="card"><h2>🧺 Carrello</h2><div id="items"></div><button class="clear" id="clear">Svuota carrello</button></section><footer>💚 La lista rimane salvata in questo browser.</footer></main><script>
const $=x=>document.getElementById(x),fmt=x=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(x/100);let items=[];try{items=JSON.parse(localStorage.getItem('spesa_items')||'[]');if(!Array.isArray(items))items=[]}catch{items=[]} $('budget').value=localStorage.getItem('spesa_budget')||'';
function cents(s){s=String(s).trim().replace(/\s/g,'');return /^\d{1,7}([.,]\d{1,2})?$/.test(s)?Math.round(Number(s.replace(',','.'))*100):null}function save(){localStorage.setItem('spesa_items',JSON.stringify(items))}function render(){let total=items.reduce((a,x)=>a+x.price*x.qty,0);$('total').textContent=fmt(total);$('count').textContent=items.reduce((a,x)=>a+x.qty,0)+' articoli';let box=$('items');box.replaceChildren();if(!items.length){let p=document.createElement('p');p.className='muted';p.textContent='Il carrello è vuoto.';box.append(p)}items.forEach((x,i)=>{let div=document.createElement('div');div.className='item';let text=document.createElement('span');text.textContent=x.name+' · '+fmt(x.price)+' × '+x.qty+' = '+fmt(x.price*x.qty);let btn=document.createElement('button');btn.className='remove';btn.textContent='✕';btn.setAttribute('aria-label','Rimuovi '+x.name);btn.onclick=()=>{items.splice(i,1);save();render()};div.append(text,btn);box.append(div)});let b=cents($('budget').value);$('budgetMsg').textContent=b&&b>0?(b>=total?'Disponibili: '+fmt(b-total):'Budget superato di '+fmt(total-b)):'Inserisci un budget per vedere quanto rimane.'}
$('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),price=cents($('price').value),qty=Number($('qty').value);if(!name||price===null||!Number.isInteger(qty)||qty<1||qty>999){alert('Controlla prezzo e quantità');return}items.push({name,price,qty});save();render();$('name').value='';$('price').value='';$('qty').value=1;$('name').focus()};$('budget').oninput=()=>{localStorage.setItem('spesa_budget',$('budget').value);render()};$('clear').onclick=()=>{if(items.length&&confirm('Svuotare il carrello?')){items=[];save();render()}};render();</script></body></html>
